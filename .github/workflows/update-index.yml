name: Update index

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Regenerate index.json from QOBLIB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Rebuild the index
        run: python tools/build_index.py

      - name: Run all tests against the new index
        run: pytest && pytest -m network

      - uses: peter-evans/create-pull-request@v6
        with:
          branch: update-index
          commit-message: Update index.json to the current QOBLIB main
          title: Update index.json to the current QOBLIB main
          body: Regenerated by `tools/build_index.py`; the offline and live tests passed.
