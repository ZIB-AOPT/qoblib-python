[build-system]
requires = ["uv_build>=0.12.11,<0.13"]
build-backend = "uv_build"

[project]
name = "qoblib"
version = "0.2.0"
description = "Python interface to QOBLIB, the Quantum Optimization Benchmarking Library: download, load, and check problem instances and solutions."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "QOBLIB maintainers" }]
dependencies = ["numpy"]
keywords = [
  "optimization",
  "benchmark",
  "quantum",
  "qubo",
  "combinatorial-optimization",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
qoblib = "qoblib.cli:main"

[project.urls]
Homepage = "https://github.com/ZIB-AOPT/QOBLIB"
Repository = "https://github.com/ZIB-AOPT/qoblib-python"
Issues = "https://github.com/ZIB-AOPT/qoblib-python/issues"

[tool.pytest.ini_options]
addopts = "-m 'not network'"
testpaths = ["tests"]
markers = [
  "network: tests that download from the live repository",
]
