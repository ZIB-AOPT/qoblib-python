[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qoblib"
dynamic = ["version"]
description = "Python interface to QOBLIB, the Quantum Optimization Benchmarking Library: list, download, verify, and cache problem instances, models, and solutions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "QOBLIB maintainers" }]
dependencies = ["pooch>=1.8"]
keywords = [
  "optimization",
  "benchmark",
  "quantum",
  "qubo",
  "combinatorial-optimization",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
progress = ["tqdm"]
scip = ["pyscipopt"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/ZIB-AOPT/QOBLIB"
Repository = "https://github.com/ZIB-AOPT/qoblib-python"
Issues = "https://github.com/ZIB-AOPT/qoblib-python/issues"

[tool.hatch.version]
path = "src/qoblib/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qoblib"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = [
  "network: tests that download from the live repository",
]
